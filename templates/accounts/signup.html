{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Register your business" %}{% endblock %}
{% block content %}
<div class="card">
  <h1>{% translate "Register your business" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">{% translate "Create account" %}</button>
  </form>
  <p><a href="{% url 'accounts:login' %}">{% translate "Already have an account? Log in" %}</a></p>
</div>
{% endblock %}
