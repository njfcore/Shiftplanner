{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Log in" %}{% endblock %}
{% block content %}
<div class="card">
  <h1>{% translate "Log in" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">{% translate "Log in" %}</button>
  </form>
  <p><a href="{% url 'accounts:signup' %}">{% translate "Register your business" %}</a></p>
</div>
{% endblock %}
